<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Addresses</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/theme-purple.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modal.css">
</head>

<body>

    <!-- 右端縦配置ヘッダー（閲覧専用なのでタイトルのみ） -->
    <header class="top-header">
        <div class="header-right-block">
            <h1 class="app-title">メールアドレス</h1>
        </div>
    </header>

    <!-- メールアドレスカード一覧 -->
    <main>

        <!-- 一覧カード（メールアドレスは隠す） -->
        <div id="email-summary-list" class="service-container">
            <!-- JSで描画される -->
        </div>

        <!-- 詳細カード（既存の email-list を詳細ビューとして使う） -->
        <div id="email-list" class="service-container" style="display:none;">
            <!-- JS（render.js）でカードが描画される -->
        </div>

        <button id="email-back-btn" class="back-btn" style="display:none;">戻る</button>

    </main>

    <!-- 詳細モーダル（閲覧専用） -->
    <div id="email-modal" class="modal">
        <div class="modal-content">
            <span id="modal-close" class="modal-close">&times;</span>

            <h2 id="modal-title"></h2>
            <p id="modal-value"></p>
        </div>
    </div>

    <!-- 下部ナビゲーションバー（画像ゼロ・テキストのみ仕様） -->
    <footer class="nav-footer">
        <nav class="bottom-nav bottom-nav-5">

            <!-- HOME -->
            <div class="nav-item" data-page="index.html">
                <span class="nav-label">ホーム</span>
                <span class="nav-sub">Home</span>
            </div>

            <!-- 個人情報 -->
            <div class="nav-item" data-page="personal.html">
                <span class="nav-label">個人情報</span>
                <span class="nav-sub">Personal</span>
            </div>

            <!-- メール（現在のページ） -->
            <div class="nav-item active" data-page="email.html">
                <span class="nav-label">メール</span>
                <span class="nav-sub">Email</span>
            </div>

            <!-- ID / パスワード -->
            <div class="nav-item" data-page="passwords.html">
                <span class="nav-label">パスワード</span>
                <span class="nav-sub">Passwords</span>
            </div>

            <!-- その他 -->
            <div class="nav-item" data-page="others.html">
                <span class="nav-label">その他</span>
                <span class="nav-sub">Others</span>
            </div>

        </nav>
    </footer>

    <!-- JS -->
    <script src="js/navigation.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/render.js"></script>

</body>


</html>
