<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" sizes="180x180" href="new-se-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="description" content="たくさんあるパスワードを忘れないためにこういうものを作成してみました。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/theme-purple.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modal.css">
    <title>パスワード管理</title>
    <link rel="manifest" href="manifest.json">

</head>

<body class="home-page">

    <!-- 背景バブル（画面全体） -->
    <div class="bubble-background">
        <div class="bubble-bg-circle circle1"></div>
        <div class="bubble-bg-circle circle2"></div>
        <div class="bubble-bg-circle circle3"></div>
    </div>

    <!-- 左下バブル（120pxの丸） -->
    <div class="bubble-area">

    </div>

    <header class="top-header">
        <div class="center-block">
            <h1 class="app-title">Secure Notes</h1>
            <button id="add-service-open-btn" class="header-btn">ADD</button>
        </div>
    </header>


    <main>
        <!-- トップページは登録専用なのでカード一覧は不要 -->
    </main>


    <!-- 登録モーダル -->
    <div id="add-service-modal" class="modal">
        <div class="modal-content">
            <span id="add-service-close" class="modal-close">&times;</span>

            <h2>サービスを追加する</h2>

            <input type="text" id="new-service-name" placeholder="サービス名">

            <select id="new-service-type">
                <option value="personal">個人情報</option>
                <option value="email">メールアドレス</option>
                <option value="passwords">パスワード</option>
                <option value="others">その他</option>
            </select>

            <input type="text" id="new-service-value" placeholder="内容を入力">

            <!-- アイコン選択 -->
            <div class="icon-gallery">
                <img src="kkrn_icon_user_1-768x768.png" data-icon="images/kkrn_icon_user_1-768x768.png"
                    class="icon-choice">
                <img src="ikkrn_icon_mail_6-768x768.png" data-icon="images/kkrn_icon_mail_6-768x768.png"
                    class="icon-choice">
                <img src="kkrn_icon_security_11-768x768.png" data-icon="images/kkrn_icon_security_11-768x768.png"
                    class="icon-choice">
                <img src="kkrn_icon_notepc_1-768x768.png" data-icon="images/kkrn_icon_notepc_1-768x768.png"
                    class="icon-choice">
            </div>

            <button id="add-service-btn" class="primary">登録する</button>
            <button id="reset-add-form-btn" class="add-btn">入力をリセット</button>
        </div>
    </div>

    <!-- 下部ナビゲーションバー（HOME active） -->
    <footer class="nav-footer">
        <nav class="bottom-nav">

            <!-- 個人情報 -->
            <div class="nav-item" data-page="personal.html">
                <img src="kkrn_icon_user_1-768x768.png" alt="Personal" class="nav-icon">
            </div>

            <!-- メール -->
            <div class="nav-item" data-page="email.html">
                <img src="kkrn_icon_mail_6-768x768.png" alt="Email" class="nav-icon">
            </div>

            <!-- パスワード -->
            <div class="nav-item" data-page="passwords.html">
                <img src="kkrn_icon_security_11-768x768.png" alt="Passwords" class="nav-icon">
            </div>

            <!-- その他 -->
            <div class="nav-item" data-page="others.html">
                <img src="kkrn_icon_notepc_1-768x768.png" alt="Others" class="nav-icon">
            </div>

        </nav>
    </footer>

    <!-- JS -->
    <script src="js/navigation.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <!-- render.js は閲覧ページ専用 -->




    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js")

        }
    </script>

</body>

</html>
