<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="description" content="たくさんあるパスワードを忘れないためにこういうものを作成してみました。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/theme-purple.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modal.css">
    <title>パスワード管理</title>
    <link rel="manifest" href="manifest.json">

</head>

<body class="home-page">


    <header class="top-header">
        <div class="center-block">
            <!-- 画像ゼロ：SVGの幾何学シールドロゴ -->
            <div class="home-logo" aria-hidden="true">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://w3.org">
                    <circle cx="32" cy="32" r="30" fill="#007AFF" fill-opacity="0.08" stroke="#007AFF"
                        stroke-opacity="0.25" stroke-width="1.5" />
                    <path d="M32 14L46 20V31C46 40.5 40 48.5 32 51C24 48.5 18 40.5 18 31V20L32 14Z" stroke="#007AFF"
                        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="32" cy="31" r="3" fill="#007AFF" />
                    <path d="M32 34V39" stroke="#007AFF" stroke-width="2.2" stroke-linecap="round" />
                </svg>
            </div>

            <h1 class="app-title">Secure Notes</h1>
            <button id="add-service-open-btn" class="header-btn">登録</button>
            <p class="home-desc">あなたの大切な情報を安全に管理します。</p>
        </div>
    </header>


    <main>
        <!-- トップページは登録専用なのでカード一覧は不要 -->
    </main>

    <!-- 登録モーダル（画像ゼロ・クリーン仕様） -->
    <div id="add-service-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title">新規登録</h2>
                    <span class="modal-subtitle">Add New Entry</span>
                </div>
                <button type="button" id="add-service-close" class="modal-close" aria-label="閉じる">&times;</button>
            </div>

            <div class="form-group">
                <label for="new-service-type" class="form-label">カテゴリ <small>Category</small></label>
                <select id="new-service-type" class="form-control">
                    <option value="personal">個人情報（Personal）</option>
                    <option value="email">メールアドレス（Email）</option>
                    <option value="passwords">パスワード（Passwords）</option>
                    <option value="others">その他（Others）</option>
                </select>
            </div>

            <div class="form-group">
                <label for="new-service-name" class="form-label">タイトル・サービス名 <small>Title / Service</small></label>
                <input type="text" id="new-service-name" class="form-control" placeholder="例：Amazon、銀行口座、マイナンバー">
            </div>

            <div class="form-group">
                <label for="new-service-value" class="form-label">内容・パスワード・番号 <small>Value / Password</small></label>
                <input type="text" id="new-service-value" class="form-control" placeholder="登録する番号やパスワードを入力">
            </div>

            <div class="modal-actions">
                <button type="button" id="add-service-btn" class="btn-primary">登録する</button>
                <button type="button" id="reset-add-form-btn" class="btn-secondary">入力をリセット</button>
            </div>
        </div>
    </div>


    <!-- 下部ナビゲーションバー（画像ゼロ・テキストのみ仕様） -->
    <footer class="nav-footer">
        <nav class="bottom-nav">

            <!-- 個人情報 -->
            <div class="nav-item" data-page="personal.html">
                <span class="nav-label">個人情報</span>
                <span class="nav-sub">Personal</span>
            </div>

            <!-- メール -->
            <div class="nav-item" data-page="email.html">
                <span class="nav-label">メールアドレス</span>
                <span class="nav-sub">Email</span>
            </div>

            <!-- パスワード -->
            <div class="nav-item" data-page="passwords.html">
                <span class="nav-label">パスワード</span>
                <span class="nav-sub">Passwords</span>
            </div>

            <!-- その他 -->
            <div class="nav-item" data-page="others.html">
                <span class="nav-label">その他</span>
                <span class="nav-sub">Others</span>
            </div>

        </nav>
    </footer>


    <!-- JS -->
    <script src="js/navigation.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <!-- render.js は閲覧ページ専用 -->




    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js")

        }
    </script>

</body>

</html>
